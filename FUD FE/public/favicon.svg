<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="frogGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="frogBellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <!-- Than & dau chinh hinh ech vang -->
  <ellipse cx="50" cy="62" rx="36" ry="28" fill="url(#frogGoldGrad)" stroke="#B45309" stroke-width="2"/>

  <!-- Bung ech vang kem sang -->
  <ellipse cx="50" cy="68" rx="22" ry="17" fill="url(#frogBellyGrad)"/>

  <!-- Chan sau trai & phai -->
  <ellipse cx="18" cy="74" rx="11" ry="8" fill="url(#frogGoldGrad)" stroke="#B45309" stroke-width="1.5"/>
  <ellipse cx="82" cy="74" rx="11" ry="8" fill="url(#frogGoldGrad)" stroke="#B45309" stroke-width="1.5"/>

  <!-- Hai u mat loi dac trung cua ech -->
  <circle cx="31" cy="36" r="17" fill="url(#frogGoldGrad)" stroke="#B45309" stroke-width="2.5"/>
  <circle cx="69" cy="36" r="17" fill="url(#frogGoldGrad)" stroke="#B45309" stroke-width="2.5"/>

  <!-- Long trang mat to tron, noi bat -->
  <circle cx="31" cy="36" r="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
  <circle cx="69" cy="36" r="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>

  <!-- Con nguoi den to ro -->
  <circle cx="33" cy="36" r="6.5" fill="#0F172A"/>
  <circle cx="71" cy="36" r="6.5" fill="#0F172A"/>

  <!-- Anh sang trang long lanh trong mat -->
  <circle cx="31" cy="33.5" r="2.8" fill="#FFFFFF"/>
  <circle cx="69" cy="33.5" r="2.8" fill="#FFFFFF"/>
  <circle cx="35" cy="38" r="1.2" fill="#FFFFFF"/>
  <circle cx="73" cy="38" r="1.2" fill="#FFFFFF"/>

  <!-- Mu cu nhan tren dau ech -->
  <polygon points="50,11 68,17 50,23 32,17" fill="#1E293B"/>
  <polygon points="42,20 58,20 56,24 44,24" fill="#0F172A"/>
  <line x1="64" y1="18" x2="68" y2="28" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
  <circle cx="68" cy="29" r="2" fill="#DC2626"/>

  <!-- Hai ma hong cam nhe -->
  <ellipse cx="24" cy="60" rx="5" ry="3" fill="#FB7185" opacity="0.7"/>
  <ellipse cx="76" cy="60" rx="5" ry="3" fill="#FB7185" opacity="0.7"/>

  <!-- Nu cuoi vui tuoi -->
  <path d="M 37 57 Q 50 67 63 57" stroke="#92400E" stroke-width="2.8" stroke-linecap="round" fill="none"/>

  <!-- Hai ban chan truoc -->
  <circle cx="41" cy="88" r="5" fill="url(#frogGoldGrad)" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="59" cy="88" r="5" fill="url(#frogGoldGrad)" stroke="#B45309" stroke-width="1.5"/>
</svg>
